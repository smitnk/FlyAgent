name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write   # publish the full connectome as a release asset
env:
  SHIU_COMMIT: 91bdd1e7dcf193f3e7ca5a8933497fcef63b7960   # philshiu/Drosophila_brain_model (MIT), FlyWire v783 export
  MODEL_URL: https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy pandas pyarrow

      # 1) Real connectome data -> FLYC binaries
      - uses: actions/cache@v4
        with:
          path: ext/shiu
          key: shiu-${{ env.SHIU_COMMIT }}
      - name: Fetch FlyWire v783 connectivity (Shiu et al.)
        run: |
          if [ ! -f ext/shiu/Connectivity_783.parquet ]; then
            rm -rf ext/shiu && git clone --depth 1 https://github.com/philshiu/Drosophila_brain_model.git ext/shiu
            [ "$(git -C ext/shiu rev-parse HEAD)" = "$SHIU_COMMIT" ] || echo "::warning::upstream moved past pinned commit $SHIU_COMMIT"
          fi
          ls -la ext/shiu
          sha256sum ext/shiu/Connectivity_783.parquet ext/shiu/Completeness_783.csv
      - name: Convert connectome
        run: |
          set -o pipefail; mkdir -p build
          python -u scripts/build_connectome.py ext/shiu build/connectome app/src/main/assets/fly783_subset.bin 2>&1 | tee build/convert.log || { tail -15 build/convert.log | sed 's/^/::error::/'; exit 1; }
          grep -vE "^\s*$" build/convert.log | sed 's/^/::notice::/'

      # 2) Native engine tests on the real data, validated against the paper's own Brian2 output
      - name: Build native code for host
        run: cmake -S native-test -B build/host -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build build/host -j4 > /dev/null
      - run: build/host/engine_test
      - name: Simulate sugar GRN activation (full brain + subset)
        run: |
          set -o pipefail
          for f in full subset; do
            src=build/connectome/fly783_full.bin; [ $f = subset ] && src=app/src/main/assets/fly783_subset.bin
            build/host/sim_cli $src build/connectome/sugar_ids.txt 100 10 build/connectome/ours_$f.json | tee build/sim_$f.log
            echo "::notice::$f: $(tail -1 build/sim_$f.log)"
          done
          python scripts/validate_sim.py build/connectome/ours_full.json build/connectome/ref_sugar100.json full-brain-vs-paper strict
          python scripts/validate_sim.py build/connectome/ours_subset.json build/connectome/ref_sugar100.json subset-vs-paper

      # 3) Real Qwen3-0.6B through our llama.cpp wrapper
      - uses: actions/cache@v4
        with: { path: build/model, key: qwen3-0.6b-q4_0 }
      - name: Verify model source and run LLM smoke test
        run: |
          mkdir -p build/model
          curl -sI "$MODEL_URL" | grep -iE "^(HTTP|x-linked-etag|x-linked-size)" | sed 's/^/::notice::model /'
          [ -f build/model/q.gguf ] || curl -sfL -o build/model/q.gguf "$MODEL_URL"
          echo "::notice::model sha256 $(sha256sum build/model/q.gguf | cut -c1-64) size $(stat -c%s build/model/q.gguf)"
          build/host/llm_test build/model/q.gguf

      # 4) Android build + JVM tests
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Gradle test + assembleDebug
        run: |
          set -o pipefail
          gradle --no-daemon test assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |FAILED|What went wrong|error:|Exception|expected|> " build.log | grep -v "> Task" | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: echo "::notice::APK $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)"
      - uses: actions/upload-artifact@v4
        with: { name: FlyAgent-debug-apk, path: app/build/outputs/apk/debug/*.apk }

      # 5) Full connectome for in-app download
      - name: Publish full connectome release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/connectome && gzip -9 -k -f fly783_full.bin && sha256sum fly783_full.bin.gz > fly783_full.bin.gz.sha256
          echo "::notice::full connectome gz $(du -h fly783_full.bin.gz | cut -f1)"
          gh release view connectome-v783 >/dev/null 2>&1 || gh release create connectome-v783 --title "FlyWire v783 connectome (FLYC format)" \
            --notes "Full adult Drosophila brain connectivity from FlyWire v783 (CC BY 4.0, doi:10.5281/zenodo.10676866; Dorkenwald et al. 2024, Schlegel et al. 2024), via the Shiu et al. 2024 export (MIT). Converted by scripts/build_connectome.py; no edges added or changed."
          gh release upload connectome-v783 fly783_full.bin.gz fly783_full.bin.gz.sha256 --clobber
      - name: Check Android native code is optimized
        run: |
          f=$(find app/.cxx -name build.ninja -path "*arm64-v8a*" | head -1)
          grep -q -- "-O3" "$f" && ! grep -q -- " -O0 " "$f" && echo "::notice::arm64 native code built with -O3" || { echo "::error::native code not optimized"; exit 1; }
