name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: |
          set -o pipefail
          gradle --no-daemon test assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |FAILED|What went wrong|Exception|expected|> " build.log | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with: { name: FlyAgent-debug-apk, path: app/build/outputs/apk/debug/*.apk }
